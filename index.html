<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
<title>高齢者診療トレーニング</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#F3F6F7;
    --surface:#FFFFFF;
    --surface-2:#E7EDEF;
    --ink:#1E2A33;
    --ink-soft:#4A5C68;
    --ink-faint:#5C6C75;
    --line:#D6E0E4;
    --primary:#3D5A73;
    --primary-strong:#28404F;
    --primary-tint:#E3EBEF;
    --accent:#96501C;
    --accent-tint:#F7E7D6;
    --good:#276B43;
    --good-tint:#E4F3EA;
    --on-solid:#FFFFFF;
    --warn:#96501C;
    --warn-tint:#F7E7D6;
    --mark:#8A5A12;
    --mark-tint:#F3E7D3;
    --bad:#B23A3A;
    --bad-tint:#FBE7E5;
    --cat-pattern:#3D5A73;
    --cat-pattern-tint:#E3EBEF;
    --cat-danger:#9C3B2E;
    --cat-danger-tint:#F6E1DD;
    --cat-chronic:#5F4E12;
    --cat-chronic-tint:#F1EEDC;
    --lab-high:#B23A3A;
    --lab-high-tint:#FBE7E5;
    --lab-low:#2A6E77;
    --lab-low-tint:#E1F0F1;
    --shadow: 0 1px 2px rgba(19,26,52,.06), 0 6px 20px rgba(19,26,52,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161C22;
      --surface:#1F272E;
      --surface-2:#28323A;
      --ink:#EDF2F4;
      --ink-soft:#B7C4CC;
      --ink-faint:#8FA0A8;
      --line:#354049;
      --on-solid:#161C22;
      --primary:#9CC5DE;
      --primary-strong:#C9E1EF;
      --primary-tint:#22323E;
      --accent:#E3A45D;
      --accent-tint:#3A2A15;
      --good:#6FC796;
      --good-tint:#16301F;
      --warn:#E3A45D;
      --warn-tint:#3A2A15;
      --mark:#D9A54B;
      --mark-tint:#332510;
      --bad:#E27C7C;
      --bad-tint:#3A1B1B;
      --cat-pattern:#9CC5DE;
      --cat-pattern-tint:#22323E;
      --cat-danger:#E08A72;
      --cat-danger-tint:#3A241E;
      --cat-chronic:#D9C374;
      --cat-chronic-tint:#332C12;
      --lab-high:#E27C7C;
      --lab-high-tint:#3A1B1B;
      --lab-low:#7FCED9;
      --lab-low-tint:#122E30;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#161C22;
    --surface:#1F272E;
    --surface-2:#28323A;
    --ink:#EDF2F4;
    --ink-soft:#B7C4CC;
    --ink-faint:#8FA0A8;
    --line:#354049;
    --on-solid:#161C22;
    --primary:#9CC5DE;
    --primary-strong:#C9E1EF;
    --primary-tint:#22323E;
    --accent:#E3A45D;
    --accent-tint:#3A2A15;
    --good:#6FC796;
    --good-tint:#16301F;
    --warn:#E3A45D;
    --warn-tint:#3A2A15;
    --mark:#D9A54B;
    --mark-tint:#332510;
    --bad:#E27C7C;
    --bad-tint:#3A1B1B;
    --cat-pattern:#9CC5DE;
    --cat-pattern-tint:#22323E;
    --cat-danger:#E08A72;
    --cat-danger-tint:#3A241E;
    --cat-chronic:#D9C374;
    --cat-chronic-tint:#332C12;
    --lab-high:#E27C7C;
    --lab-high-tint:#3A1B1B;
    --lab-low:#7FCED9;
    --lab-low-tint:#122E30;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.65;
  }
  h1,h2,h3,.disp{
    font-family:"Zen Kaku Gothic New","Noto Sans JP",system-ui,sans-serif;
    text-wrap:balance;
    margin:0;
  }
  .mono{ font-family:"JetBrains Mono","Noto Sans JP",monospace; font-variant-numeric:tabular-nums; }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:14px 18px 12px;
    display:flex; align-items:center; gap:10px;
  }
  .topbar .back{
    appearance:none; border:none; background:transparent; color:var(--primary);
    font-size:15px; font-weight:700; cursor:pointer; padding:6px 8px 6px 0;
    display:flex; align-items:center; gap:2px; min-height:44px;
    font-family:inherit;
  }
  .topbar .title{
    font-size:15px; font-weight:700; color:var(--ink-soft);
    letter-spacing:.02em;
    flex:1;
    text-align:center;
    margin-right:34px;
  }
  main{flex:1; padding:0 18px 48px;}

  /* ---------- HOME ---------- */
  .hero{ padding:28px 4px 18px; }
  .hero .eyebrow{
    font-size:12px; font-weight:700; letter-spacing:.14em; color:var(--primary);
    text-transform:uppercase;
  }
  .hero h1{ font-size:26px; font-weight:900; color:var(--ink); margin-top:8px; line-height:1.4; }
  .hero p{ color:var(--ink-soft); font-size:14px; margin-top:10px; max-width:44ch; }
  .hero .thesis{
    margin-top:14px; padding:13px 16px; border-radius:12px;
    background:var(--primary-tint); color:var(--primary-strong);
    font-size:13px; font-weight:700; line-height:1.7;
  }

  .progress-card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:16px 18px; margin:16px 0 8px; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:16px;
  }
  .progress-ring{ position:relative; width:56px; height:56px; flex:none;}
  .progress-ring svg{ transform:rotate(-90deg); }
  .progress-ring .pct{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--primary-strong);
  }
  .progress-text{flex:1;}
  .progress-text .num{font-size:13px; font-weight:700; color:var(--ink);}
  .progress-text .sub{font-size:12.5px; color:var(--ink-faint); margin-top:2px;}
  .review-pill-btn{
    appearance:none; border:1px solid var(--warn); background:var(--warn-tint); color:var(--warn);
    font-weight:700; font-size:12.5px; padding:10px 14px; min-height:44px;
    display:inline-flex; align-items:center; border-radius:999px; cursor:pointer;
    white-space:nowrap; font-family:inherit;
  }
  .summary-cta{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--primary-tint); border:1px solid var(--primary); border-radius:16px;
    padding:14px 18px; margin:10px 0 24px; cursor:pointer;
    width:100%; text-align:left; font-family:inherit; appearance:none;
  }
  .summary-cta .t{display:block; font-size:14px; font-weight:700; color:var(--primary-strong);}
  .summary-cta .s{display:block; font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .summary-cta .arrow{color:var(--primary-strong); font-size:18px; flex:none;}

  .section-head{ display:flex; align-items:baseline; gap:8px; margin:26px 0 12px; }
  .section-head .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .section-head.pattern .dot{background:var(--cat-pattern);}
  .section-head.danger .dot{background:var(--cat-danger);}
  .section-head.chronic .dot{background:var(--cat-chronic);}
  .section-head h2{font-size:15px; font-weight:700; color:var(--ink);}
  .section-head .count{font-size:12px; color:var(--ink-faint); font-weight:400;}

  .case-grid{ display:flex; flex-direction:column; gap:10px; }
  .case-card{
    display:flex; align-items:center; gap:14px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:14px 14px; cursor:pointer; text-align:left; width:100%;
    box-shadow:var(--shadow); font-family:inherit;
    appearance:none;
  }
  .case-card:active{ transform:scale(.99); }
  .ion-badge{
    flex:none; width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:"Zen Kaku Gothic New",sans-serif; font-weight:900; font-size:13.5px;
  }
  .ion-badge.pattern{ background:var(--cat-pattern-tint); color:var(--cat-pattern); }
  .ion-badge.danger{ background:var(--cat-danger-tint); color:var(--cat-danger); }
  .ion-badge.chronic{ background:var(--cat-chronic-tint); color:var(--cat-chronic); }
  .case-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px;}
  .case-body .hint{
    font-size:14px; font-weight:600; color:var(--ink); line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .status-chip{
    flex:none; align-self:flex-start; font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:999px;
    white-space:nowrap;
  }
  .status-chip.none{ background:var(--surface-2); color:var(--ink-faint); }
  .status-chip.good{ background:var(--good-tint); color:var(--good); }
  .status-chip.partial{ background:var(--warn-tint); color:var(--warn); }
  .status-chip.poor{ background:var(--bad-tint); color:var(--bad); }

  .empty-review{ text-align:center; padding:40px 20px; color:var(--ink-faint); font-size:14px; }

  /* ---------- CASE VIEW ---------- */
  .case-hero{ padding:22px 0 4px; }
  .case-hero .tag{ font-size:12px; font-weight:700; letter-spacing:.08em; }
  .case-hero .tag.pattern{ color:var(--cat-pattern); } .case-hero .tag.danger{ color:var(--cat-danger); } .case-hero .tag.chronic{ color:var(--cat-chronic); }
  .case-hero h1{ font-size:21px; font-weight:900; margin-top:8px; }

  .vignette{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:18px 20px; margin-top:16px; box-shadow:var(--shadow); font-size:15.5px; color:var(--ink);
  }
  .lab-strip{ margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); display:flex; flex-wrap:wrap; gap:7px; }
  .lab-chip{
    display:inline-flex; align-items:baseline; gap:5px; padding:5px 10px; border-radius:8px;
    font-size:12.5px; font-weight:600;
  }
  .lab-chip .k{ color:inherit; opacity:1; font-weight:700; }
  .lab-chip .v{ font-family:"JetBrains Mono",monospace; font-weight:700; font-variant-numeric:tabular-nums; }
  .lab-chip .u{ font-size:10.5px; opacity:.85; }
  .lab-chip.high{ background:var(--lab-high-tint); color:var(--lab-high); }
  .lab-chip.low{ background:var(--lab-low-tint); color:var(--lab-low); }
  .lab-chip.normal{ background:var(--surface-2); color:var(--ink-soft); }
  .finding-line{ margin-top:10px; font-size:12.5px; color:var(--ink-soft); }
  .finding-line b{ color:var(--ink); font-weight:700; }

  .selfcheck-card, .answer-report{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:4px 20px 6px; margin-top:20px; box-shadow:var(--shadow);
  }
  .sc-row{ padding:16px 0; border-bottom:1px dashed var(--line); }
  .sc-row:last-child{ border-bottom:none; }
  .sc-row label{ display:flex; align-items:baseline; gap:8px; font-size:13.5px; font-weight:700; color:var(--ink); margin-bottom:9px; }
  .sc-row label .n{ color:var(--primary); flex:none; }
  .sc-row textarea{
    width:100%; min-height:54px; max-height:320px; overflow-y:auto; resize:vertical; border-radius:10px;
    border:1px solid var(--line); background:var(--bg); color:var(--ink);
    padding:10px 12px; font-family:inherit; font-size:14.5px; line-height:1.6;
  }
  .sc-row textarea:focus{ outline:2px solid var(--primary); outline-offset:1px; }
  .sc-row textarea::placeholder{ color:var(--ink-faint); }

  .ar-row{ padding:16px 0; border-bottom:1px dashed var(--line); }
  .ar-row:last-child{ border-bottom:none; }
  .ar-row h3{ display:flex; align-items:center; gap:9px; font-size:13.5px; font-weight:700; margin-bottom:9px; }
  .ar-row .ico{
    width:23px;height:23px;border-radius:7px;flex:none; display:flex;align-items:center;justify-content:center;
    font-size:12px; font-weight:900; color:var(--on-solid);
  }
  .ico.severity{ background:var(--bad); }
  .ico.pattern{ background:var(--primary-strong); }
  .ico.workup{ background:var(--cat-chronic); }
  .ico.action{ background:var(--primary); }
  .ar-row ul{ margin:0; padding-left:19px; font-size:15.5px; color:var(--ink); }
  .ar-row li{ margin-bottom:6px; } .ar-row li:last-child{ margin-bottom:0; }

  .reveal-btn{
    width:100%; margin-top:22px; appearance:none; border:none; cursor:pointer;
    background:var(--primary); color:var(--on-solid); font-weight:700; font-size:15px;
    padding:15px; border-radius:14px; font-family:inherit;
    box-shadow:0 4px 14px rgba(61,90,115,.28);
  }
  .reveal-btn:active{ transform:scale(.99); }

  .answer-wrap{ margin-top:26px; }
  .diagnosis-reveal{
    background:var(--primary-tint); border:1.5px solid var(--primary); border-radius:16px;
    padding:18px 20px; margin-bottom:16px; text-align:center;
  }
  .diagnosis-reveal .dr-eyebrow{ font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--primary-strong); }
  .diagnosis-reveal .dr-title{
    font-family:"Zen Kaku Gothic New",sans-serif; font-size:20px; font-weight:900;
    margin-top:6px; color:var(--ink);
  }
  .diagnosis-reveal .dr-sub{ font-size:12.5px; margin-top:6px; color:var(--ink-soft); }

  .pitfall-block{
    background:var(--warn-tint); border:2px solid var(--warn); border-radius:16px;
    padding:18px 20px; margin-bottom:20px; box-shadow:0 4px 16px -6px rgba(150,80,28,.35);
  }
  .pitfall-block .pf-label{
    display:flex; align-items:center; gap:8px;
    font-size:12.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--warn);
    margin-bottom:10px;
  }
  .pitfall-block .pf-mark{
    width:26px;height:26px;border-radius:50%;background:var(--warn);color:var(--on-solid);
    display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;flex:none;
  }
  .pitfall-block p{ margin:0; font-size:15px; color:var(--ink); line-height:1.75; }

  .answer-wrap .divider{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .answer-wrap .divider .line{ flex:1; height:1px; background:var(--line); }
  .answer-wrap .divider span{ font-size:12px; font-weight:700; color:var(--ink-faint); letter-spacing:.08em;}

  mark{
    background:var(--mark-tint); color:var(--mark); padding:1px 5px; border-radius:5px;
    font-weight:700; box-decoration-break:clone; -webkit-box-decoration-break:clone;
  }

  .rx-block{
    background:var(--surface); border:1px solid var(--primary); border-radius:16px;
    padding:16px 18px; margin-top:20px; box-shadow:var(--shadow);
  }
  .rx-label{
    display:flex; align-items:center; gap:8px;
    font-size:13px; font-weight:700; color:var(--primary-strong); margin-bottom:8px;
  }
  .rx-mark{
    width:22px;height:22px;border-radius:7px;background:var(--primary);color:var(--on-solid);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex:none;
    font-family:"Zen Kaku Gothic New",sans-serif;
  }
  .rx-caveat{ margin:0 0 10px; font-size:12px; color:var(--ink-faint); line-height:1.6; }
  .rx-block ul{ margin:0; padding-left:18px; font-size:14.5px; color:var(--ink); line-height:1.7; }
  .rx-block li{ margin-bottom:8px; } .rx-block li:last-child{ margin-bottom:0; }
  .rx-block .mono{ font-size:.95em; }

  .pearl-block{
    background:var(--surface-2); border:1px solid var(--line); border-radius:16px;
    padding:16px 18px; margin-top:20px;
  }
  .pearl-block .pb-label{ font-size:11.5px; font-weight:700; letter-spacing:.06em; color:var(--ink-faint); text-transform:uppercase; margin-bottom:8px; }
  .pearl-block ul{ margin:0; padding-left:18px; font-size:14.5px; color:var(--ink-soft); line-height:1.6; }
  .pearl-block li{ margin-bottom:6px; } .pearl-block li:last-child{ margin-bottom:0; }

  .refs-block{ margin-top:16px; padding-top:14px; border-top:1px dashed var(--line); }
  .refs-block h4{ font-size:12px; font-weight:700; color:var(--ink-faint); letter-spacing:.06em; margin-bottom:8px; }
  .refs-block ol{ margin:0; padding-left:19px; font-size:12.5px; color:var(--ink-soft); line-height:1.6; }
  .refs-block li{ margin-bottom:7px; } .refs-block li:last-child{ margin-bottom:0; }
  .refs-block a{ color:var(--ink-soft); text-decoration:underline; text-underline-offset:2px; word-break:break-all; }
  .refs-block a:hover{ color:var(--primary); }

  .assess-block{ margin-top:26px; }
  .assess-block .q{ font-size:14px; font-weight:700; margin-bottom:12px; text-align:center; }
  .assess-row{ display:flex; gap:8px; }
  .assess-btn{
    flex:1; appearance:none; cursor:pointer; border-radius:12px; padding:13px 6px;
    font-family:inherit; font-size:12.5px; font-weight:700; line-height:1.4;
    border:1.5px solid var(--line); background:var(--surface); color:var(--ink-soft);
    min-height:44px;
  }
  .assess-btn.good{ border-color:var(--good); }
  .assess-btn.partial{ border-color:var(--warn); }
  .assess-btn.poor{ border-color:var(--bad); }
  .assess-btn.good.active{ background:var(--good); color:var(--on-solid); }
  .assess-btn.partial.active{ background:var(--warn); color:var(--on-solid); }
  .assess-btn.poor.active{ background:var(--bad); color:var(--on-solid); }
  .save-warning{
    margin-top:12px; padding:10px 14px; border-radius:10px;
    background:var(--bad-tint); color:var(--bad); font-size:12.5px; font-weight:600; line-height:1.5;
  }

  .after-assess{ margin-top:22px; display:flex; flex-direction:column; gap:10px; animation:fadein .3s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .nav-btn{ appearance:none; border:none; cursor:pointer; border-radius:12px; padding:14px; font-family:inherit; font-size:14.5px; font-weight:700; text-align:center; }
  .nav-btn.primary{ background:var(--primary); color:var(--on-solid); }
  .nav-btn.ghost{ background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line); }

  /* ---------- APPROACH (初動まとめ) VIEW ---------- */
  .approach-hero{ padding:24px 0 6px; }
  .approach-hero .eyebrow{ font-size:12px; font-weight:700; color:var(--primary); letter-spacing:.1em; text-transform:uppercase;}
  .approach-hero h1{ font-size:22px; font-weight:900; margin-top:8px; }
  .approach-hero p{ font-size:13.5px; color:var(--ink-soft); margin-top:8px; }

  .goal-note{
    margin-top:18px; padding:16px 18px; border-radius:14px;
    background:var(--accent-tint); border:1.5px solid var(--accent);
  }
  .goal-note .gn-label{ font-size:12px; font-weight:700; letter-spacing:.06em; color:var(--accent); text-transform:uppercase; }
  .goal-note .gn-body{ font-size:13.5px; color:var(--ink); margin-top:6px; line-height:1.7; }

  .flow{ margin-top:22px; position:relative; }
  .flow-step{ display:flex; gap:14px; position:relative; padding-bottom:22px; }
  .flow-step:last-child{ padding-bottom:0; }
  .flow-step .rail{ display:flex; flex-direction:column; align-items:center; flex:none; }
  .flow-step .node{
    width:32px; height:32px; border-radius:50%; background:var(--primary); color:var(--on-solid);
    display:flex; align-items:center; justify-content:center; font-weight:900; font-size:13px;
    font-family:"Zen Kaku Gothic New",sans-serif; flex:none; z-index:1;
  }
  .flow-step .stem{ width:2px; flex:1; background:var(--line); margin-top:2px; }
  .flow-step .content{ flex:1; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow); margin-top:1px;}
  .flow-step .content h3{ font-size:14.5px; font-weight:700; }
  .flow-step .content p{ font-size:13px; color:var(--ink-soft); margin-top:5px; }

  a{color:var(--primary);}

<script>
(function(){

  var CAT_BADGE = { pattern:"型", danger:"急", chronic:"整" };

  var CASES = [
    {
      id:"orthostatic_hypotension_polypharmacy", num:1, cat:"pattern", tag:"転倒・起立時のふらつき",
      title:"多剤併用による起立性低血圧と転倒", hint:"81歳男性・多剤内服中・朝の起立時のふらつきで転倒",
      vignette:"81歳男性。高血圧に対しアムロジピン(アムロジン/ノルバスク)5mg、オルメサルタン(オルメテック)20mg、フロセミド(ラシックス)20mgの3剤を内服中。前立腺肥大症による夜間頻尿の悪化に対し、2週間前からタムスロシン(ハルナールD、選択的α1A遮断薬)0.2mgが追加になった。その後、朝の洗面所での立ち上がり時にふらつきを自覚するようになり、本日、自宅の廊下で転倒した。頭部や四肢に打撲はあるが骨折は認めない。転倒の瞬間に胸痛・動悸・けいれん様の動きはなかったという。5分以上の臥位安静後の血圧144/86mmHg・脈拍68/分。立位1分後124/78mmHg、立位3分後112/70mmHg・脈拍74/分で、この時点でふらつきが再現された。",
      labs:[ {k:"Na",v:"141",u:"mEq/L",abn:"normal"}, {k:"K",v:"4.0",u:"mEq/L",abn:"normal"}, {k:"Cr",v:"0.9",u:"mg/dL",abn:"normal"}, {k:"Hb",v:"13.4",u:"g/dL",abn:"normal"} ],
      finding:"神経学的所見に異常なし。心音整・心雑音なし。打撲部位以外に明らかな外傷所見なし。",
      prompts:{
        severity:{ label:"検査値や転倒の経過から、この患者の重症度・緊急性をどう評価するか", ph:"外傷の程度、脈拍の変化のパターンなど…" },
        pattern:{ label:"内服薬の変化と身体所見から、めまい・転倒の機序をどう考えるか", ph:"起立時の血圧変化の基準、薬剤の作用点など…" },
        workup:{ label:"原因薬剤を特定し、他の原因を除外するために何を確認するか", ph:"起立試験の正しいやり方、心電図、他の内服薬の確認など…" },
        action:{ label:"今後の転倒予防に向けて、薬剤調整をどう行うか", ph:"中止・減量する薬、非薬物的対策など…" }
      },
      answer:{
        severity:["今回の転倒では骨折や頭部外傷を認めておらず外傷としては軽症だが、<mark>高齢者の転倒は再転倒・骨折・ADL低下につながる重要な警鐘サイン</mark>であり、原因検索を後回しにしてはならない","立位での脈拍上昇がわずか(68→74/分)である点も、<mark>高齢者では起立時の代償性頻脈自体が加齢や薬剤の影響で減弱しやすい</mark>ことを示す所見として押さえておく"],
        pattern:["<mark>臥位144/86mmHgから立位3分後112/70mmHgへと収縮期32mmHg・拡張期16mmHg低下しており、起立性低血圧の基準(臥位から立位1〜3分以内に収縮期≥20mmHgまたは拡張期≥10mmHgの低下)を満たす</mark>","<mark>Ca拮抗薬(アムロジピン)・ARB(オルメサルタン)・利尿薬(フロセミド)という降圧薬3剤に加え、前立腺肥大症治療薬のタムスロシン(ハルナールD)が新規追加されたことで、血管拡張・体液量減少・交感神経遮断という複数の機序が重なり、起立性低血圧が増悪した</mark>と考えられる","<mark>α1遮断薬は投与開始・増量直後に強い血圧低下(いわゆるfirst-dose effect)を起こしやすく</mark>、症状出現のタイミング(追加から2週間後)と矛盾しない","<mark>AGS Beers基準(2023年改訂)は、ドキサゾシン・プラゾシン・テラゾシンなど前立腺選択性を持たない(α1サブタイプを区別しない)末梢性α1遮断薬を降圧薬として用いることを、起立性低血圧のリスクの高さから推奨していない(前立腺肥大症の治療目的での使用は対象外)</mark>。タムスロシンは前立腺選択性の高いα1A遮断薬でこの基準の対象そのものではないが、<mark>他の降圧薬と併用すれば同様に起立性低血圧を助長しうる</mark>ことは変わらない"],
        workup:["<mark>起立性低血圧の正しい測定は、5分以上の臥位安静後に血圧・脈拍を測定し、立位後1分・3分の時点で再測定する</mark>ことである","電解質・腎機能・貧血の有無(Na・K・Cr・Hbなど)を確認し、脱水や貧血など他の原因を除外する(<mark>本例ではいずれも正常範囲であり、薬剤性の関与を積極的に考える根拠になる</mark>)","心電図で不整脈・伝導障害の有無を確認し、心原性の失神を除外する","<mark>お薬手帳だけでなく他院・他科の処方や市販薬の重複がないかも確認</mark>する"],
        action:["<mark>直近に追加されたタムスロシンをまず見直し、可能であれば減量・中止、または起立性低血圧を起こしにくい他クラスへの変更を検討</mark>する","<mark>降圧薬3剤についても家庭血圧の推移を見ながら減量できる薬剤がないか評価し、複数の降圧薬を同時期に増量・追加しないよう調整</mark>する","<mark>非薬物的対策(起立時はゆっくり動く、弾性ストッキング、下肢挙上、十分な水分摂取)を薬物調整と並行して指導</mark>する","転倒リスク評価や住環境(段差・手すり)の確認も含め、多職種で再転倒予防に取り組む"]
      },
      rx:["タムスロシン(ハルナールD)0.2mgは通常の開始用量であり、これ以上減らせる余地は乏しい。症状が薬剤性と判断されれば増量せず据え置くか、内服タイミングを就寝前に変更する、あるいは前立腺肥大症の重症度次第では中止も選択肢になる","複数の降圧薬(アムロジピン、オルメサルタンなど)を漫然と継続せず、家庭血圧や起立時症状を確認しながら減量できる薬剤がないか見直す","非薬物的対策(ゆっくりとした体位変換、弾性ストッキング、水分摂取)を薬物調整と並行して指導する"],
      pitfall:"<mark>「高齢者のふらつき・転倒は年のせい」と決めつけて内服薬を見直さない</mark>ことは典型的な見落としである。逆に<mark>降圧薬をすべて即座に中止すると血圧コントロール不良による心血管イベントのリスクが高まる</mark>ため、薬剤ごとの必要性を吟味しながら段階的に調整することが重要である。",
      pearl:["<mark>起立性低血圧の定義は、5分以上の臥位安静後、立位1〜3分以内に収縮期血圧≥20mmHgまたは拡張期血圧≥10mmHgの低下</mark>である","<mark>複数の降圧薬・α1遮断薬・抗うつ薬などは単剤では問題なくても併用で起立性低血圧のリスクが積み重なる</mark>","新規薬剤の追加後、特に<mark>投与開始・増量直後の症状変化</mark>に注意する","高齢者の転倒は<mark>薬剤の見直しが再転倒予防の重要な柱の一つ</mark>である","<mark>Beers基準は前立腺選択性を持たない末梢性α1遮断薬(ドキサゾシンなど)を降圧目的で使うことを推奨しないが、前立腺肥大症治療目的のタムスロシンは対象外</mark>という区別を知っておく"],
      refs:[ {author:"Freeman R, Wieling W, Axelrod FB, et al.", title:"Consensus statement on the definition of orthostatic hypotension, neurally mediated syncope and the postural tachycardia syndrome", source:"Clin Auton Res 21(2):69-72", year:"2011", url:"https://pubmed.ncbi.nlm.nih.gov/21431947/"}, {title:"American Geriatrics Society 2023 updated AGS Beers Criteria for potentially inappropriate medication use in older adults", source:"J Am Geriatr Soc 71(7):2052-2081", year:"2023", url:"https://pubmed.ncbi.nlm.nih.gov/37139824/"}, {author:"日本老年医学会.", title:"高齢者の安全な薬物療法ガイドライン2025", source:"日本老年医学会", year:"2025", url:"https://www.jpn-geriat-soc.or.jp/publications/other/guideline_koreisha_sdt_2025.html"} ]
    },
    {
      id:"prescribing_cascade_edema", num:2, cat:"pattern", tag:"浮腫の悪化・新規処方",
      title:"アムロジピンによる浮腫と処方カスケード", hint:"78歳女性・両下腿浮腫に利尿薬が追加された後の倦怠感とこむら返り",
      vignette:"78歳女性。血圧コントロール不良のため3か月前にアムロジピン(アムロジン/ノルバスク)が5mgから10mgに増量された。増量から1か月ほどで両下腿に浮腫が出現し、他院でうっ血性心不全の疑いとしてフロセミド(ラシックス)20mg/日が追加された。その後、倦怠感とこむら返りが出現し、食事摂取量もやや低下している。体重はこの3か月で2kg減少した。心不全の既往はなく、増量前の心エコーでは心機能に異常は指摘されていない。浮腫は圧痕を伴い両側対称性で、朝より夕方に増悪する。",
      labs:[ {k:"Na",v:"137",u:"mEq/L",abn:"normal"}, {k:"K",v:"3.1",u:"mEq/L",abn:"low"}, {k:"Cr",v:"1.1",u:"mg/dL",abn:"high"}, {k:"BNP",v:"38",u:"pg/mL",abn:"normal"} ],
      finding:"心音整、肺野に湿性ラ音なし、頸静脈怒張なし。両下腿に圧痕性浮腫を認める。",
      prompts:{
        severity:{ label:"検査値と症状から、この患者の重症度・緊急性をどう評価するか", ph:"低カリウム血症の程度、脱水徴候、体重減少の意味など…" },
        pattern:{ label:"浮腫が出現した経過と、その後の処方の流れから、何が起きているか考える", ph:"新規薬剤と症状出現のタイミング、浮腫の性質など…" },
        workup:{ label:"心不全以外の原因を除外し、これまでの処方の経緯を確認するために何を行うか", ph:"心エコー・BNPの解釈、内服薬の開始日の確認など…" },
        action:{ label:"今後の処方をどう組み立て直すか", ph:"どの薬を中止・減量するか、処方カスケードを断ち切る発想など…" }
      },
      answer:{
        severity:["<mark>K 3.1mEq/Lの低カリウム血症に加え、Cr 1.1mg/dL・体重減少・倦怠感がみられる。ベースラインのCr値は不明だが、この組み合わせは利尿薬による脱水・電解質異常が進行している</mark>ことを示唆し、放置すれば不整脈や転倒のリスクが高まる","BNPは正常範囲であり、<mark>心不全の存在を積極的に支持する所見ではない</mark>ことも重症度評価に含める"],
        pattern:["<mark>アムロジピンなどジヒドロピリジン系Ca拮抗薬による下腿浮腫は、体液貯留ではなく前毛細血管の選択的拡張による毛細血管内圧の上昇が機序である血管拡張性の浮腫であり、心不全による浮腫とは病態が異なる</mark>(「血管性浮腫」という言葉はACE阻害薬などで生じるブラジキニン性の血管浮腫(angioedema)を指すことが多く、この浮腫とは別の病態なので混同しないよう注意する)","<mark>この浮腫がうっ血性心不全と誤解され利尿薬が追加されたことで、本来不要な薬剤の副作用(低カリウム血症・脱水・腎機能悪化)という新たな問題が生じている。これはある薬の副作用が新しい病気と誤診され、それに対して別の薬が追加される「処方カスケード」</mark>と呼ばれる典型的なパターンである","浮腫の出現がアムロジピン増量から1か月というタイミングで生じていることも、<mark>Ca拮抗薬性浮腫を支持する</mark>"],
        workup:["<mark>浮腫が出現した時期とアムロジピン増量の時期を照合し、時系列で薬剤との関連を確認</mark>する","<mark>心エコー・BNPで心機能に異常がないことを確認し、心不全を積極的に疑う所見に乏しいことを確かめる</mark>","下腿浮腫が圧痕性で両側対称性か、静脈うっ滞・低アルブミン血症など他の原因を示唆する所見がないかも確認する"],
        action:["<mark>Ca拮抗薬性浮腫と判断されればフロセミドは不要であった可能性が高く、中止または減量を検討</mark>する。ただし急な中止で血圧が変動しないよう経過を見ながら調整する","<mark>浮腫自体への対応としては、アムロジピンの減量、または浮腫を起こしにくい他クラスの降圧薬(ARB/ACE阻害薬の追加、他系統への変更など)への変更を検討</mark>する","低カリウム血症を補正し、<mark>今後は新しい症状が出た際に「新しい病気」を疑う前に「既存薬の副作用ではないか」を必ず考える習慣</mark>をつける"]
      },
      rx:["Ca拮抗薬性浮腫が疑われる場合、フロセミド(ラシックス)など利尿薬の追加ではなくアムロジピン(アムロジン/ノルバスク)自体の減量・変更を優先する","浮腫を起こしにくい代替として、ARB(オルメサルタン(オルメテック)など)やACE阻害薬の追加、あるいは他クラス降圧薬への切り替えを検討する","低カリウム血症は補正しつつ、腎機能・電解質の推移を確認しながら不要な利尿薬を減量・中止する"],
      pitfall:"<mark>新しい症状が出るたびに新しい薬を追加し、既存の薬剤が原因である可能性を検討しない</mark>のが処方カスケードの本質的な誤りである。特に高齢者では<mark>「薬の副作用」がまず鑑別に挙がるべき場面で、安易に別の疾患・別の薬剤対応に飛びつきやすい</mark>ことを意識する。",
      pearl:["<mark>処方カスケードとは、ある薬の副作用が新しい病気と誤診され、それに対処するための薬剤が追加されることで生じる悪循環</mark>である","<mark>Ca拮抗薬(特にジヒドロピリジン系)による下腿浮腫は体液貯留ではなく血管性であり、利尿薬では改善しにくい</mark>","新しい症状が出たら、まず<mark>新規薬剤・用量変更の時期と症状出現のタイミングを照合</mark>する","<mark>薬剤を追加する前に「これは既存の薬の副作用ではないか」を一度立ち止まって考える</mark>習慣が処方カスケードの予防になる"],
      refs:[ {author:"Rochon PA, Gurwitz JH.", title:"Optimising drug treatment for elderly people: the prescribing cascade", source:"BMJ 315(7115):1096-1099", year:"1997", url:"https://pubmed.ncbi.nlm.nih.gov/9366745/"}, {author:"日本老年医学会.", title:"高齢者の安全な薬物療法ガイドライン2025", source:"日本老年医学会", year:"2025", url:"https://www.jpn-geriat-soc.or.jp/publications/other/guideline_koreisha_sdt_2025.html"} ]
    },
    {
      id:"anticholinergic_burden_cognitive", num:3, cat:"pattern", tag:"物忘れの進行・多科受診",

      finding:"神経学的巣症状なし。ブドウ糖静注後2時間で血糖再低下(45mg/dL)を認め、追加投与を要した。",
      prompts:{

      answer:{
        severity:["意識障害を伴う低血糖は生命に関わる緊急事態であり、特に高齢者では遷延した低血糖そのものが<mark>不可逆的な神経学的障害や転倒・骨折、死亡リスクの上昇</mark>と関連する","本例では冷汗を認めたが、高齢者では加齢や併存疾患により<mark>自律神経症状が目立たないまま意識障害が前面に出ることがあり</mark>、周囲が「様子がおかしい」と気づいた時点で既に高度な低血糖に至っていることがある","ブドウ糖投与後2時間で再度血糖が低下しており、<mark>単回投与だけでは不十分な遷延性・再発性の低血糖</mark>と判断される"],
        pattern:["<mark>グリメピリド(アマリール)などのSU薬は主に肝代謝を受けるが、活性代謝物の排泄には腎機能が関与し、腎機能が低下すると代謝物が蓄積して薬効(インスリン分泌刺激作用)が遷延しやすくなる</mark>","<mark>感冒様症状による経口摂取量低下があったにもかかわらずSU薬の内服量を調整しなかったことが直接の誘因であり、そこに腎機能低下による薬剤蓄積が重なって低血糖が重症化・遷延化した</mark>","<mark>SU薬による低血糖はインスリンによるものと異なり、薬剤の作用持続時間が長いため一度改善しても再発しやすい(遷延性)</mark>という特徴がある","<mark>AGS Beers基準(2023年改訂)は、SU薬を糖尿病治療の第一・第二選択薬として避けるべきとし、やむを得ず使用する場合もグリベンクラミドやグリメピリドのような長時間作用型ではなく短時間作用型を優先すべきとしている</mark>(米国での代表例はグリピジドだが、日本ではグリクラジド(グリミクロン)がより短時間作用型のSU薬として使われる)。まさに長時間作用型SU薬で低血糖が強く遷延しやすいという本例の経過と一致する"],
        workup:["<mark>腎機能の推移(以前の値との比較)を確認し、SU薬導入時からどの程度低下しているかを把握</mark>する","食事摂取状況を具体的に聴取し、<mark>体調不良時の内服薬調整(いわゆるシックデイルール)が守られていたかを確認</mark>する","<mark>SU薬の作用を増強しうる薬剤(ST合剤などの抗菌薬、NSAIDsなど)の併用がないかも確認</mark>する"],
        action:["<mark>ブドウ糖静注で血糖を是正した後もSU薬による遷延性低血糖は再発しうるため、症状・血糖の推移を見ながら十分な観察期間とブドウ糖の持続投与を検討</mark>する","<mark>グリメピリド(アマリール)は中止し、腎機能を踏まえて低血糖リスクの低い薬剤への変更を検討する。DPP-4阻害薬の多くは腎排泄性で腎機能に応じた減量が必要(例:シタグリプチンは中等度〜高度腎機能低下で25mg/日へ減量)だが、リナグリプチン(トラゼンタ)は胆汁排泄が主体で腎機能による用量調整が原則不要という違いがあり、本例のような高度腎機能低下例ではより選びやすい</mark>。必要に応じてインスリンへの切り替えも検討する","<mark>体調不良で食事が摂れない時は血糖降下薬を減量・中止する「シックデイルール」を患者・家族にあらためて説明</mark>する","今後の血糖コントロール目標について、<mark>高齢者では低血糖回避を優先したやや緩めの目標設定を個別に検討</mark>する"]
      },
      rx:["低血糖是正には50%ブドウ糖液20mLなどの静注に加え、SU薬による遷延性低血糖を念頭に10%ブドウ糖液の持続点滴も検討し、血糖の再低下がないか経過を追う","グリメピリド(アマリール)は中止し、腎機能を考慮した血糖降下薬へ変更する(腎機能非依存のリナグリプチン(トラゼンタ)、または腎機能に応じて減量したDPP-4阻害薬、必要に応じてインスリン)","体調不良時に血糖降下薬をどう調整するか(シックデイルール)を患者・家族に具体的に説明する"],
      pitfall:"<mark>「一度ブドウ糖を投与して意識が戻ったから大丈夫」と早期に経過観察を終えてしまう</mark>のは、SU薬による遷延性・再発性低血糖の特徴を踏まえていない典型的な誤りである。また<mark>腎機能を確認せずに以前と同じ用量のSU薬を漫然と継続する</mark>のも危険である。",
      pearl:["<mark>一度ブドウ糖投与で意識が戻っても「解決した」と早合点せず、原因薬剤の作用持続時間を踏まえて再発の可能性を織り込んで経過を見る</mark>","<mark>腎機能は日々変わりうる。「以前は使えていた用量」がいつまでも安全とは限らない</mark>","<mark>体調不良で食事が摂れない時にいつも通りの内服を続けてしまうことは、患者本人にとっては自然な行動であり、事前の説明がなければ防げない</mark>","<mark>PIMのリストを覚えるより「なぜその薬が高齢者で問題になりやすいか」という機序を理解しておくと、リストにない薬剤にも応用できる</mark>"],
      refs:[ {title:"Sulfonylureas", source:"StatPearls, NCBI Bookshelf", year:"2024", url:"https://www.ncbi.nlm.nih.gov/books/NBK513225/"}, {title:"American Geriatrics Society 2023 updated AGS Beers Criteria for potentially inappropriate medication use in older adults", source:"J Am Geriatr Soc 71(7):2052-2081", year:"2023", url:"https://pubmed.ncbi.nlm.nih.gov/37139824/"}, {author:"日本老年医学会・日本糖尿病学会(編著).", title:"高齢者糖尿病診療ガイドライン2023", source:"南江堂", year:"2023", url:"https://www.jpn-geriat-soc.or.jp/publications/other/diabetes_treatment_guideline.html"} ]

      vignette:"80歳男性。誤嚥性肺炎で入院し抗菌薬治療で軽快、退院前カンファレンスで内服薬の見直しを行うことになった。入院前のADLは屋内杖歩行、認知機能はやや低下(改訂長谷川式簡易知能評価スケール22点)。お薬手帳を確認したところ、以下が長期間処方されていた:アムロジピン(アムロジン/ノルバスク)5mg(高血圧・8年間)、カンデサルタン(ブロプレス)8mg(高血圧・8年間)、アスピリン(バイアスピリン)100mg(5年前の脳梗塞後から)、クロピドグレル(プラビックス)75mg(同じ脳梗塞後から、ステント留置歴なし)、アトルバスタチン(リピトール)10mg(脂質異常症・8年間)、ランソプラゾール(タケプロン)30mg(5年前の胃潰瘍治療目的で開始、以降継続)、ゾルピデム(マイスリー)5mg(不眠・10年間)、ブロチゾラム(レンドルミン)0.25mg(不眠・2年前に他院で追加処方され重複)、センノシド(プルゼニド)・酸化マグネシウム(マグミット)(便秘・3年間)、ロキソプロフェン(ロキソニン、変形性膝関節症の痛み時に頓用)、メコバラミン(メチコバール、開始理由がカルテ上不明)。この半年で自宅内での転倒が2回あった。",

      answer:{
        severity:["<mark>内服薬の数が増えるほど薬物有害事象・薬物相互作用のリスクは積算的に高まり、10剤を超える処方は特にハイリスク</mark>とされる","<mark>入院・退院といった医療の場が切り替わるタイミングは、処方内容全体を見直す数少ない機会であり、この機会を逃すと不要な処方が漫然と継続されやすい</mark>","この半年で2回の転倒歴があることも<mark>薬剤性の要因(鎮静系薬剤、起立性低血圧を来しうる降圧薬など)を積極的に見直すべき根拠</mark>になる"],
        pattern:["<mark>ゾルピデム(マイスリー)とブロチゾラム(レンドルミン)という2種類の睡眠薬が重複して処方されている</mark>のは典型的な見直しポイントであり、他院での追加が把握されていなかった可能性を示唆する。<mark>ゾルピデムはベンゾジアゼピン骨格を持たない「Z薬」だが、AGS Beers基準はベンゾジアゼピン系薬剤と同様の理由(せん妄・転倒・骨折リスク、睡眠の質の改善も限定的)でZ薬も「可能な限り避ける」薬剤に位置づけており、この2剤はどちらも同じ勧告に該当する</mark>","<mark>アスピリン(バイアスピリン)とクロピドグレル(プラビックス)の2剤併用抗血小板療法が、ステント留置歴のない脳梗塞後5年間にわたり継続されている</mark>点は、急性期を過ぎれば単剤抗血栓療法へ移行するのが一般的であり、継続理由の再確認を要する(<mark>STOPP/START基準v3は、ステント留置歴のない脳梗塞後の2剤併用抗血小板療法を4週間を超えて長期継続することを、出血リスクの上乗せに見合うベネフィットが乏しいとして問題視している</mark>)","<mark>ランソプラゾール(タケプロン、PPI)が胃潰瘍治療目的の開始から5年間漫然と継続</mark>されている点は、AGS Beers基準が「高リスク例(経口ステロイド併用、慢性NSAID使用、びらん性食道炎など)を除き8週間を超える定期投与を避ける」としているパターンに一見あてはまるが、<mark>本例はロキソプロフェンを頓用し、かつHb 11.0mg/dLの貧血を伴っており、まさにこの「慢性NSAID使用」の除外規定に該当しうる高リスク例</mark>である点に注意する","<mark>開始理由がカルテ上不明なメコバラミン(メチコバール)のような薬剤</mark>は、処方意図が失われたまま継続されている典型例である"],
        workup:["<mark>それぞれの薬剤について「今も適応があるか」「開始した科・理由は何か」を一つずつ確認</mark>する。処方元の診療科に問い合わせることも有効である","<mark>STOPP/START基準v3(2剤併用抗血小板療法の長期継続を問題視)やAGS Beers基準(65歳以上を対象とするPIM基準の代表格で、Z薬・長期PPIなどを具体的に列挙)、日本老年医学会「高齢者の安全な薬物療法ガイドライン2025」の「特に慎重な投与を要する薬物のリスト」を参照し、該当する薬剤を洗い出す</mark>","<mark>Hb 11.0mg/dLの貧血について、慢性的な消化管出血(NSAIDs頓用・抗血小板薬2剤併用という出血リスクの重なりを踏まえ)がないか便潜血や必要に応じた内視鏡検査を検討</mark>する","<mark>逆に開始を検討すべき薬剤(START側)がないかも確認する。2回の転倒歴があることから骨密度評価やビタミンD・カルシウムの補充が必要でないか、疼痛や気分の評価が十分か</mark>なども合わせて確認する","患者・家族の意向、今後の生活の場(施設入所など)や予後の見通しも踏まえて優先順位をつける"],
        action:["<mark>重複している睡眠薬はどちらか一方(できれば作用時間の長いブロチゾラム)を段階的に減量・中止し、急な中止による離脱症状・反跳性不眠に注意</mark>する","<mark>アスピリン(バイアスピリン)・クロピドグレル(プラビックス)の2剤併用については、神経内科・循環器科と継続の可否を協議し、明確な適応がなければ単剤へ移行</mark>する","<mark>ロキソプロフェン(ロキソニン)を優先的に中止する。本例はNSAIDs頓用・2剤併用抗血小板療法・貧血が重なる高リスク例であり、ランソプラゾール(タケプロン)はこの出血リスクに対する防御役を担っている可能性があるため、PPIを先に中止するのではなくNSAIDsを止めて出血リスク自体を下げる方が優先度が高い</mark>。鎮痛にはアセトアミノフェンなど他の薬剤への変更を検討する","<mark>貧血の原因検索(便潜血、必要に応じ内視鏡)の結果を踏まえ、PPIの継続要否をあらためて判断する。開始理由が不明なメコバラミン(メチコバール)など効果の乏しい薬剤は中止を検討</mark>する","減薬後は<mark>症状の変化を見ながら、必要であれば元の薬剤に戻す判断も含めて経過を追う</mark>"]

      rx:["重複する睡眠薬(ゾルピデム(マイスリー)・ブロチゾラム(レンドルミン))は一方を段階的に減量・中止し(急な中止は避ける)、非薬物的な睡眠衛生指導を併用する","2剤併用抗血小板療法は継続の明確な適応がなければ単剤(通常はアスピリン(バイアスピリン)またはクロピドグレル(プラビックス)のいずれか)へ移行する","ロキソプロフェン(ロキソニン)はアセトアミノフェンへの変更を優先する。ランソプラゾール(タケプロン)は抗血小板薬併用・貧血という背景を踏まえ、貧血の原因検索の結果が出るまでは安易に中止しない"],
      pitfall:"<mark>「今まで飲んでいたから」という理由だけで開始理由を確認せずに全て継続する</mark>のが最も典型的な誤りである。逆に<mark>入院を機にまとめて一度に全ての薬を中止すると、離脱症状や原疾患の悪化(不眠の反跳、血栓症の再発など)を招く</mark>ため、優先順位をつけて段階的に行うことが重要である。",
      pearl:["<mark>処方の見直しは「開始する時」だけでなく「入院・退院などの節目で見直す」ことが重要</mark>である","<mark>PIMのリストに載っている薬剤でも、その患者固有の背景(本例のNSAIDs併用・貧血のようなPPIの継続を支持する要素)によっては「載っているから中止」が正しいとは限らない</mark>。リストは出発点であり、個別化した判断が必要である","<mark>減薬は一度に全てではなく優先順位をつけて段階的に行い、離脱症状や症状再燃に注意</mark>する","<mark>開始理由がカルテ上たどれない薬剤は、それ自体が中止を検討すべきサイン</mark>である"],
      refs:[ {author:"O'Mahony D, Cherubini A, Guiteras AR, et al.", title:"STOPP/START criteria for potentially inappropriate prescribing in older people: version 3", source:"Eur Geriatr Med 14(4):625-632", year:"2023", url:"https://pubmed.ncbi.nlm.nih.gov/37256475/"}, {title:"American Geriatrics Society 2023 updated AGS Beers Criteria for potentially inappropriate medication use in older adults", source:"J Am Geriatr Soc 71(7):2052-2081", year:"2023", url:"https://pubmed.ncbi.nlm.nih.gov/37139824/"}, {author:"日本老年医学会.", title:"高齢者の安全な薬物療法ガイドライン2025", source:"日本老年医学会", year:"2025", url:"https://www.jpn-geriat-soc.or.jp/publications/other/guideline_koreisha_sdt_2025.html"} ]

    if(s==="partial") return "一部抜けた";
    if(s==="poor") return "ほぼ言えなかった";
    return "未挑戦";
  }
  var VALID_CATS = ["pattern","danger","chronic"];
  function safeCat(c){ return VALID_CATS.indexOf(c) !== -1 ? c : "pattern"; }

  function caseById(id){
    for(var i=0;i<CASES.length;i++){ if(CASES[i].id===id) return CASES[i]; }
    return null;
  }
  function completedCount(){
    var n=0;
    for(var i=0;i<CASES.length;i++){ if(safeStatus(state.progress[CASES[i].id]) !== "none") n++; }
    return n;
  }
  function masteredCount(){
    var n=0;
    for(var i=0;i<CASES.length;i++){ if(state.progress[CASES[i].id]==="good") n++; }
    return n;
  }
  function reviewCases(){
    return CASES.filter(function(c){
      var s = state.progress[c.id];
      return s === "partial" || s === "poor";
    });
  }

  function go(view, caseId){
    state.view = view;
    state.caseId = caseId || null;
    render();
    window.scrollTo(0,0);
  }

  /* ---------------- RENDER: HOME ---------------- */
  function renderHome(){
    var done = completedCount();
    var mastered = masteredCount();
    var total = CASES.length;
    var pct = Math.round(mastered/total*100);
    var rev = reviewCases();

    var circumference = 2*Math.PI*24;
    var offset = circumference * (1 - pct/100);

    var subLine;
    if(done < total){
      subLine = (total-done)+"症例が未挑戦";
    } else if(rev.length){
      subLine = "復習対象が "+rev.length+" 症例あります";
    } else {
      subLine = "全症例クリアです";
    }

    var html = "";
    html += '<div class="hero">';
    html += '  <div class="eyebrow">高齢者診療 初動トレーニング</div>';
    html += '  <h1>高齢者診療トレーニング<br>― ポリファーマシーと薬物有害事象</h1>';
    html += '  <p>研修医が出会う高齢者診療7症例。「薬が原因かもしれない」という視点を持ち、答えを見る前に自分の言葉で4つの問いに答えてみましょう。</p>';
    html += '  <div class="thesis">ゴールは診断名を当てることではなく、多剤併用による有害事象のパターンを見抜き、見逃してはいけない重症所見を取りこぼさず、処方を安全に見直す力をつけることです。</div>';
    html += '</div>';

    html += '<div class="progress-card">';
    html += '  <div class="progress-ring"><svg width="56" height="56"><circle cx="28" cy="28" r="24" stroke="var(--surface-2)" stroke-width="5" fill="none"/><circle cx="28" cy="28" r="24" stroke="var(--primary)" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="'+circumference+'" stroke-dashoffset="'+offset+'"/></svg><div class="pct">'+pct+'%</div></div>';
    html += '  <div class="progress-text"><div class="num">'+mastered+' / '+total+' 症例 自力で言えた</div><div class="sub">'+subLine+'</div></div>';
    if(rev.length){
      html += '  <button class="review-pill-btn" data-action="toggle-review">復習</button>';
    }
    html += '</div>';

    html += '<button class="summary-cta" data-action="goto-approach"><span><span class="t">高齢者診療の初動まとめ</span><span class="s">重症度評価→機序把握→原因鑑別→処方の見直し</span></span><span class="arrow" aria-hidden="true">›</span></button>';

    if(state.reviewOnly){
      html += '<div class="section-head"><span class="dot" style="background:var(--warn)"></span><h2>復習対象の症例</h2><span class="count">'+rev.length+'件</span></div>';
      if(rev.length===0){
        html += '<div class="empty-review">復習対象の症例はありません。<br>「一覧」から症例を確認できます。</div>';
      } else {
        html += '<div class="case-grid">'+rev.map(caseCardHtml).join("")+'</div>';
      }
    } else {
      ["pattern","danger","chronic"].forEach(function(cat){
        var list = CASES.filter(function(c){ return c.cat===cat; });
        html += '<div class="section-head '+cat+'"><span class="dot"></span><h2>'+CAT_LABEL[cat]+'</h2><span class="count">'+list.length+'症例</span></div>';
        html += '<div class="case-grid">'+list.map(caseCardHtml).join("")+'</div>';
      });
    }

    return html;
  }

  function caseCardHtml(c){
    var status = safeStatus(state.progress[c.id]);
    var cat = safeCat(c.cat);
    var numStr = (c.num<10?"0":"")+c.num;
    return '<button class="case-card" data-action="open-case" data-id="'+c.id+'">'+
      '<span class="ion-badge '+cat+'" aria-hidden="true">'+CAT_BADGE[cat]+'</span>'+
      '<span class="case-body"><span class="hint">'+numStr+'　'+escapeHtml(c.hint)+'</span></span>'+
      '<span class="status-chip '+status+'">'+statusLabel(status)+'</span>'+
    '</button>';
  }

  /* ---------------- RENDER: CASE ---------------- */
  var revealCache = {};
  var draftCache = loadDrafts();
  var pendingStatus = {};

  function labChipHtml(l){
    var abn = (l.abn==="high"||l.abn==="low") ? l.abn : "normal";
    var symbol = abn==="high" ? "▲" : (abn==="low" ? "▼" : "");
    return '<span class="lab-chip '+abn+'"><span class="k">'+escapeHtml(l.k)+'</span><span class="v mono">'+(symbol?symbol+" ":"")+escapeHtml(l.v)+'</span>'+(l.u?'<span class="u">'+escapeHtml(l.u)+'</span>':'')+'</span>';
  }

  function renderCase(c){
    var cat = safeCat(c.cat);
    var html = "";
    html += '<div class="case-hero"><div class="tag '+cat+'">症例 '+(c.num<10?"0":"")+c.num+'・'+escapeHtml(c.tag)+'</div><h1>'+escapeHtml(c.hint)+'</h1></div>';
    html += '<div class="vignette">'+c.vignette;
    html += '<div class="lab-strip">'+c.labs.map(labChipHtml).join("")+'</div>';
    if(c.finding){ html += '<div class="finding-line"><b>所見　</b>'+escapeHtml(c.finding)+'</div>'; }
    html += '</div>';

    var revealed = !!revealCache[c.id];
    var drafts = draftCache[c.id] || {};

    html += '<div class="selfcheck-card" id="prompts">';
    getPrompts(c).forEach(function(p){
      var fieldId = "sc-"+c.id+"-"+p.key;
      html += '<div class="sc-row">';
      html += '<label for="'+fieldId+'"><span class="n">'+p.num+'</span>'+p.label+'</label>';
      html += '<textarea id="'+fieldId+'" data-field="'+p.key+'" placeholder="'+escapeHtml(p.ph)+'">'+ (drafts[p.key] ? escapeHtml(drafts[p.key]) : "") +'</textarea>';
      html += '</div>';
    });
    html += '</div>';
    html += '<div class="save-warning" id="draftSaveWarning" role="status" hidden>⚠ この端末に下書きを保存できませんでした。プライベートブラウズ中か、ストレージが無効になっている可能性があります。この画面を離れると記述内容が失われます。</div>';

    if(!revealed){
      html += '<button class="reveal-btn" data-action="reveal">模範解答を見る</button>';
    } else {
      html += renderAnswer(c);
    }

    return html;
  }

  function renderAnswer(c){
    var catLabel = CAT_LABEL[safeCat(c.cat)];
    var html = '<div class="answer-wrap" tabindex="-1">';
    html += '<div class="diagnosis-reveal"><div class="dr-eyebrow">病態</div><div class="dr-title">'+escapeHtml(c.title)+'</div><div class="dr-sub">'+escapeHtml(catLabel)+'</div></div>';

    html += '<div class="pitfall-block"><div class="pf-label"><span class="pf-mark" aria-hidden="true">!</span>ありがちな誤対応</div><p>'+c.pitfall+'</p></div>';

    html += '<div class="divider"><div class="line"></div><span>模範解答</span><div class="line"></div></div>';

    html += '<div class="answer-report">';
    getPrompts(c).forEach(function(p){
      html += answerRowHtml(p.key, p.label, c.answer[p.key]);
    });
    html += '</div>';

    html += renderRx(c);
    html += renderPearl(c);
    html += renderRefs(c);

    html += '</div>';

    html += '<div class="assess-block">';
    html += '<div class="q">自分の答えと照らし合わせて、自己評価しましょう</div>';
    var curRaw = pendingStatus[c.id] || state.progress[c.id] || "";
    var cur = VALID_STATUSES.indexOf(curRaw) !== -1 ? curRaw : "";
    html += '<div class="assess-row">';
    html += assessBtn("good","自力で言えた", cur);
    html += assessBtn("partial","一部抜けた", cur);
    html += assessBtn("poor","ほぼ言えなかった", cur);
    html += '</div>';
    if(cur && lastSaveFailed){
      html += '<div class="save-warning" role="status">⚠ この端末には保存できませんでした。プライベートブラウズ中か、ストレージが無効になっている可能性があります。この記録はこの画面を離れると失われます。</div>';
    }
    html += '</div>';

    if(cur){
      html += '<div class="after-assess">';
      html += '<button class="nav-btn primary" data-action="next-case">次の症例へ</button>';
      html += '<button class="nav-btn ghost" data-action="goto-home">一覧に戻る</button>';
      html += '</div>';
    }

    return html;
  }

  function answerRowHtml(key, label, items){
    return '<div class="ar-row"><h3><span class="ico '+key+'" aria-hidden="true">'+ICO[key]+'</span>'+label+'</h3>'+
      '<ul>'+items.map(function(t){return '<li>'+t+'</li>';}).join("")+'</ul></div>';
  }

  function renderRx(c){
    if(!c.rx || !c.rx.length) return "";
    var items = c.rx.map(function(t){ return '<li>'+t+'</li>'; }).join("");
    return '<div class="rx-block"><div class="rx-label"><span class="rx-mark" aria-hidden="true">℞</span>具体的な治療例</div>'+
      '<p class="rx-caveat">年齢・腎機能・体重・併存疾患により個別調整が必要な目安です。実際の投与量・タイミングは必ず添付文書・自施設のプロトコル・指導医に確認してください。</p>'+
      '<ul>'+items+'</ul></div>';
  }

  function renderPearl(c){
    if(!c.pearl || !c.pearl.length) return "";
    var items = c.pearl.map(function(t){ return '<li>'+t+'</li>'; }).join("");
    return '<div class="pearl-block"><div class="pb-label">まとめ</div><ul>'+items+'</ul></div>';
  }

  function renderRefs(c){
    if(!c.refs || !c.refs.length) return "";
    var items = c.refs.map(refEntryHtml).join("");
    return '<div class="refs-block"><h4>参考</h4><ol>'+items+'</ol></div>';
  }

  function refEntryHtml(r){
    var citationParts = [];
    if(r.author) citationParts.push(escapeHtml(r.author));
    if(r.title) citationParts.push(escapeHtml(r.title));
    var pub = [];
    if(r.source) pub.push(escapeHtml(r.source));
    if(r.year) pub.push(escapeHtml(String(r.year)));
    if(pub.length) citationParts.push(pub.join(" "));
    var text = citationParts.join("．");
    var linkHtml = "";
    if(r.url){
      linkHtml = '<br><a href="'+escapeHtml(r.url)+'" target="_blank" rel="noopener noreferrer">'+escapeHtml(r.url)+'</a>';
    }
    return '<li>'+text+linkHtml+'</li>';
  }

  function assessBtn(kind, label, cur){
    return '<button class="assess-btn '+kind+(cur===kind?' active':'')+'" data-action="assess" data-kind="'+kind+'" aria-pressed="'+(cur===kind?'true':'false')+'">'+label+'</button>';
  }

  /* ---------------- RENDER: APPROACH (初動まとめ) ---------------- */
  function renderApproach(){
    var html = "";
    html += '<div class="approach-hero"><div class="eyebrow">高齢者診療の初動まとめ</div><h1>初動を守る2つの武器</h1><p>高齢者診療で出会う症状は原因が非常に多岐にわたり丸暗記では対応しきれない。<mark>①症例によらず必ず自問する4つの問い</mark>と、<mark>②病態を整理する3つの型(有害事象パターン・重症所見・処方適正化)</mark>、この2つを持っておくと、初めて見る症例でも初動を組み立てられる。</p></div>';
    html += '<div class="goal-note"><div class="gn-label">⚡ このアプリのゴール</div><div class="gn-body">「診断名を当てる」ことではありません。<mark>新しい症状の背景に薬剤の影響がないかを常に疑い、見逃してはいけない重症所見を取りこぼさず、処方を安全に見直す(減らす)</mark>ことがゴールです。</div></div>';

    html += '<h2 class="axis-section-title">①症例によらず、まず自問する4つ</h2>';
    html += '<div class="flow">';
    FLOW.forEach(function(f,i){
      html += '<div class="flow-step">';
      html += '<div class="rail"><div class="node">'+(i+1)+'</div>'+(i<FLOW.length-1?'<div class="stem"></div>':'')+'</div>';
      html += '<div class="content"><h3>'+f.t+'</h3><p>'+f.d+'</p></div>';
      html += '</div>';
    });
    html += '</div>';

    html += '<h2 class="axis-section-title">②高齢者診療を整理する3つの型</h2>';
    html += '<p class="axis-section-note">個別症例で学んだ知識を、初めて見る症例にも応用できる「型」に変換しておく。</p>';
    html += AXES.map(renderAxisCard).join('');

    html += '<div class="global-note"><div class="gl-label">国内外のガイドラインとの関係に少しだけ触れると</div><p>高齢者の薬物療法に関する代表的な基準として、米国のAGS Beers基準(2023年改訂)がある。<mark>Beers基準は65歳以上の高齢者を対象に、避けるべき・注意を要する薬剤を具体的な薬効群ごとに列挙したPIM(potentially inappropriate medication、潜在的に不適切な薬剤)基準の代表格</mark>で、本アプリが扱う論点(第一世代抗ヒスタミン薬、ベンゾジアゼピン系薬剤とZ薬、前立腺選択性のない末梢性α1遮断薬の降圧目的使用、長時間作用型SU薬、高用量ジゴキシン、長期PPIなど)はいずれもBeers基準が個別に取り上げている項目である。</p><p>欧州には同様の趣旨のSTOPP/START基準(2023年version 3)がある。<mark>本アプリで扱った2剤併用抗血小板療法の長期継続という論点は、Beers基準ではなくSTOPP/START基準が具体的に取り上げているもの</mark>で、両基準は対象こそ重なるが列挙している項目が完全に一致するわけではない。</p><p>日本では2025年7月に<mark>日本老年医学会「高齢者の安全な薬物療法ガイドライン2025」</mark>が約10年ぶりに全面改訂された。対象年齢はBeers基準(65歳以上)よりやや高い<mark>75歳以上(75歳未満でもフレイルのある場合を含む)</mark>に設定されている。この日本版はBeers基準・STOPP/START基準の内容も参考にしつつ、「特に慎重な投与を要する薬物のリスト」「開始を考慮するべき薬物のリスト」に加え、複数薬剤にまたがる抗コリン作用の負荷を評価する<mark>「日本版抗コリン薬リスクスケール」</mark>を新たに収載するなど、国内の処方実態に即した内容が加わっている点が特徴である。</p></div>';

    html += '<div class="approach-foot">迷ったら、重症度・機序(新規薬剤との関係)・原因(薬剤性か他の原因か)・処方の見直し(STOPP/START・Beers・日本の指針)の4つに立ち返る。</div>';
    return html;
  }

  function renderAxisCard(ax){
    var html = '<div class="axis-card '+ax.cat+'">';
    html += '<div class="axis-head"><span class="axis-dot"></span><h3>'+ax.label+'</h3></div>';
    html += '<p class="axis-intro">'+ax.intro+'</p>';
    html += '<ol class="axis-steps">';
    ax.steps.forEach(function(s){
      html += '<li><b>'+s.t+'</b><span>'+s.d+'</span></li>';
    });
    html += '</ol>';
    html += '<div class="axis-note">'+ax.note+'</div>';
    html += '<div class="axis-refs">'+ax.refs.map(escapeHtml).join(' / ')+'</div>';
    html += '</div>';
    return html;
  }

  /* ---------------- MASTER RENDER ---------------- */
  function render(){
    var topbarHtml, mainHtml;

    if(state.view==="home"){
      topbarHtml = state.reviewOnly
        ? '<button class="back" data-action="goto-home-full">‹ 一覧</button><div class="title">復習リスト</div>'
        : '<div class="title">高齢者診療トレーニング</div>';
      mainHtml = renderHome();
      if(!state.reviewOnly){
        mainHtml += '<div class="disclaimer">内容は教育目的の一般的な整理です。実際の治療方針は必ず各施設のプロトコルや指導医の判断、日本老年医学会などの最新ガイドラインに従ってください。</div>';
      }
    } else if(state.view==="case"){
      var c = caseById(state.caseId);
      if(!c){
        state.view = "home";
        state.caseId = null;
        return render();
      }
      var numStr = (c.num<10?"0":"")+c.num;
      topbarHtml = '<button class="back" data-action="goto-home">‹ 一覧</button><div class="title">症例 '+numStr+'</div>';
      mainHtml = renderCase(c);
    } else if(state.view==="approach"){
      topbarHtml = '<button class="back" data-action="goto-home">‹ 一覧</button><div class="title">初動まとめ</div>';
      mainHtml = renderApproach();
    }

    app.innerHTML = '<div class="topbar">'+topbarHtml+'</div><main>'+mainHtml+'</main>';
    bindEvents();
  }

  /* ---------------- EVENTS ---------------- */
  function nextInPool(pool, current){
    var idx = -1;
    for(var i=0;i<pool.length;i++){ if(pool[i].id===current.id){ idx = i; break; } }
    return idx === -1 ? pool[0] : pool[(idx+1) % pool.length];
  }

  function bindEvents(){
    app.querySelectorAll("[data-action]").forEach(function(el){
      el.addEventListener("click", function(){
        var action = el.getAttribute("data-action");
        if(action==="open-case"){
          revealCache[el.getAttribute("data-id")] = false;
          delete pendingStatus[el.getAttribute("data-id")];
          lastSaveFailed = false;
          go("case", el.getAttribute("data-id"));
        } else if(action==="goto-home"){
          go("home");
        } else if(action==="goto-home-full"){
          state.reviewOnly = false;
          render();
        } else if(action==="toggle-review"){
          state.reviewOnly = true;
          render();
        } else if(action==="goto-approach"){
          go("approach");
        } else if(action==="reveal"){
          lastSaveFailed = false;
          collectDraft(state.caseId, true);
          revealCache[state.caseId] = true;
          render();
          var wrap = app.querySelector(".answer-wrap");
          var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          if(wrap){
            wrap.scrollIntoView({behavior: reduceMotion ? "auto" : "smooth", block:"start"});
            wrap.focus({preventScroll:true});
          }
        } else if(action==="assess"){
          var kind = el.getAttribute("data-kind");
          var c0 = caseById(state.caseId);
          if(!c0) return;
          pendingStatus[state.caseId] = kind;
          var onDiskProgress = loadProgress();
          onDiskProgress[state.caseId] = kind;
          state.progress = onDiskProgress;
          lastSaveFailed = !saveProgress(state.progress);
          render();
          var activeBtn = app.querySelector('.assess-btn[data-kind="'+kind+'"]');
          if(activeBtn) activeBtn.focus();
        } else if(action==="next-case"){
          var c = caseById(state.caseId);
          if(!c) return;
          var pool = state.reviewOnly ? reviewCases() : CASES;
          if(state.reviewOnly && pool.length === 0){
            state.reviewOnly = false;
            pool = CASES;
          }
          var next = nextInPool(pool, c);
          revealCache[next.id] = false;
          delete pendingStatus[next.id];
          lastSaveFailed = false;
          go("case", next.id);
        }
      });
    });

    app.querySelectorAll("textarea[data-field]").forEach(function(ta){
      ta.addEventListener("input", function(){
        collectDraft(state.caseId, false);
      });
    });
  }

  var draftSaveTimer = null;
  function collectDraft(caseId, flushNow){
    var d = {};
    app.querySelectorAll("textarea[data-field]").forEach(function(ta){
      d[ta.getAttribute("data-field")] = ta.value;
    });
    draftCache[caseId] = d;
    if(draftSaveTimer){ clearTimeout(draftSaveTimer); draftSaveTimer = null; }
    function flush(){
      var ok = saveDrafts(caseId, d);
      var warnEl = document.getElementById("draftSaveWarning");
      if(warnEl){ warnEl.hidden = ok; }
    }
    if(flushNow){
      flush();
    } else {
      draftSaveTimer = setTimeout(flush, 400);
    }
  }
  function flushCurrentDraft(){
    if(state.view === "case" && state.caseId && draftCache[state.caseId]){
      saveDrafts(state.caseId, draftCache[state.caseId]);
    }
  }
  window.addEventListener("pagehide", flushCurrentDraft);
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "hidden") flushCurrentDraft();
  });

  render();
})();
</script>
</body>
</html>
